name: Release cereal client

on:
  push:
    tags:
      - 'cereal-client/*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.2.0)'
        required: true
        type: string
      build_target:
        description: 'Build target'
        required: true
        type: choice
        options:
          - all
          - windows
          - linux
          - macos
          - macos-arm64
          - macos-x64
          - windows-store
          - docker
        default: 'all'

env:
  R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ vars.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET_CDN: ${{ vars.R2_BUCKET_CDN }}
  DO_ACCESS_KEY: ${{ vars.DO_ACCESS_KEY }}
  DO_SECRET_KEY: ${{ secrets.DO_SECRET_KEY }}
  DO_SPACE_NAME_BACKUPS: ${{ vars.DO_SPACE_NAME_BACKUPS }}
  DO_SPACE_REGION: ${{ vars.DO_SPACE_REGION }}
  CDN_URL: ${{ vars.CDN_URL }}
  # Cloudflare edge cache purge for the mutable "latest-*" artifacts. Without a purge after each
  # upload the CDN can serve a stale zip against freshly-signed metadata, which the client rejects
  # as a SHA-256 mismatch. The token needs only the Zone > Cache Purge permission.
  CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
  CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
  MICROSOFT_STORE_URL: ${{ vars.MICROSOFT_STORE_URL }}
  SENTRY_DSN: ${{ vars.SENTRY_DSN }}
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
  SEKRET_KEY: ${{ secrets.SEKRET_KEY }}
  SEKRET_PROPERTIES: ${{ secrets.SEKRET_PROPERTIES }}
  # RSA private key (PEM) used to sign release metadata. Its public counterpart is embedded in the
  # client (ApplicationConfig.releasePublicKey) and verifies latest-<os>.json before updating.
  RELEASE_PRIVATE_KEY: ${{ secrets.RELEASE_PRIVATE_KEY }}
  # Apple signing credentials
  APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
  APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
  APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
  APPLE_ID: ${{ vars.APPLE_ID }}
  APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
  # Minimum versions per platform
  MIN_VERSION_WINDOWS: ${{ vars.MIN_VERSION_WINDOWS }}
  MIN_VERSION_LINUX: ${{ vars.MIN_VERSION_LINUX }}
  MIN_VERSION_MACOS_ARM64: ${{ vars.MIN_VERSION_MACOS_ARM64 }}
  MIN_VERSION_MACOS_X64: ${{ vars.MIN_VERSION_MACOS_X64 }}
  MIN_VERSION_MACOS: ${{ vars.MIN_VERSION_MACOS }}
  MIN_VERSION_WINDOWS_STORE: ${{ vars.MIN_VERSION_WINDOWS_STORE }}
  # Headless-mode image (multi-arch manifest), built by build-docker and published by publish-docker.
  DOCKER_IMAGE: ghcr.io/cereal-automation/cereal

# Every secret above is a `release` *environment* secret, not a repository one: a job sees them only
# if it declares `environment: release`, and that environment requires a maintainer's approval and
# accepts only master and release tags. The `release` job needs none of them, only GITHUB_TOKEN.
jobs:
  build-windows:
    name: Build Windows (exe)
    environment: release
    runs-on: windows-latest
    if: github.event_name == 'push' || github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'windows'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build-environment

      - name: Parse tag version
        id: version
        uses: ./.github/actions/parse-tag-version
        with:
          tag: ${{ github.event_name == 'workflow_dispatch' && format('cereal-client/{0}', github.event.inputs.version) || github.ref_name }}

      - uses: ./.github/actions/setup-sekret
        with:
          sekret-properties: ${{ env.SEKRET_PROPERTIES }}

      - name: Build and upload
        uses: ./.github/actions/build-and-upload
        with:
          version: ${{ steps.version.outputs.version }}
          version-number: ${{ steps.version.outputs.version-number }}
          is-rc: ${{ steps.version.outputs.is-rc }}
          target: exe
          sentry-auth-token: ${{ env.SENTRY_AUTH_TOKEN }}
          sentry-dsn: ${{ env.SENTRY_DSN }}
          sekret-key: ${{ env.SEKRET_KEY }}
          version-json-platform: windows
          cdn-url: ${{ env.CDN_URL }}
          download-url: ${{ env.CDN_URL }}/client/cereal-client-latest.exe
          min-version: ${{ env.MIN_VERSION_WINDOWS }}
          release-private-key: ${{ env.RELEASE_PRIVATE_KEY }}
          cloudflare-zone-id: ${{ env.CLOUDFLARE_ZONE_ID }}
          cloudflare-api-token: ${{ env.CLOUDFLARE_CACHE_PURGE_TOKEN }}
          r2-account-id: ${{ env.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ env.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ env.R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ env.R2_BUCKET_CDN }}
          do-access-key: ${{ env.DO_ACCESS_KEY }}
          do-secret-key: ${{ env.DO_SECRET_KEY }}
          do-space-name: ${{ env.DO_SPACE_NAME_BACKUPS }}
          do-space-region: ${{ env.DO_SPACE_REGION }}

  build-linux:
    name: Build Linux (AppImage)
    environment: release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'linux'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build-environment

      - name: Parse tag version
        id: version
        uses: ./.github/actions/parse-tag-version
        with:
          tag: ${{ github.event_name == 'workflow_dispatch' && format('cereal-client/{0}', github.event.inputs.version) || github.ref_name }}

      - uses: ./.github/actions/setup-sekret
        with:
          sekret-properties: ${{ env.SEKRET_PROPERTIES }}

      # AppImage is the self-installing auto-update artifact (the client replaces its own running
      # image and relaunches — no package manager, no root). This is what latest-linux.json points to.
      - name: Build AppImage
        uses: ./.github/actions/build-appimage
        with:
          version: ${{ steps.version.outputs.version-number }}
          is-rc: ${{ steps.version.outputs.is-rc }}
          sentry-auth-token: ${{ env.SENTRY_AUTH_TOKEN }}
          sentry-dsn: ${{ env.SENTRY_DSN }}
          sekret-key: ${{ env.SEKRET_KEY }}

      # Hash + RSA-sign the AppImage, upload to R2, back up to DO Spaces. The signed download_sha256
      # must match the file the client fetches, so the AppImage must not be modified after this step
      # (see #484).
      - name: Publish artifact
        uses: ./.github/actions/publish-artifact
        with:
          version: ${{ steps.version.outputs.version }}
          is-rc: ${{ steps.version.outputs.is-rc }}
          binary-path: dist/client/cereal-client-latest.AppImage
          platform: linux
          cdn-url: ${{ env.CDN_URL }}
          download-url: ${{ env.CDN_URL }}/client/cereal-client-latest.AppImage
          min-version: ${{ env.MIN_VERSION_LINUX }}
          release-private-key: ${{ env.RELEASE_PRIVATE_KEY }}
          cloudflare-zone-id: ${{ env.CLOUDFLARE_ZONE_ID }}
          cloudflare-api-token: ${{ env.CLOUDFLARE_CACHE_PURGE_TOKEN }}
          r2-account-id: ${{ env.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ env.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ env.R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ env.R2_BUCKET_CDN }}
          do-access-key: ${{ env.DO_ACCESS_KEY }}
          do-secret-key: ${{ env.DO_SECRET_KEY }}
          do-space-name: ${{ env.DO_SPACE_NAME_BACKUPS }}
          do-space-region: ${{ env.DO_SPACE_REGION }}

  build-macos-arm64:
    name: Build macOS ARM64 (DMG)
    environment: release
    runs-on: macos-15
    if: github.event_name == 'push' || github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'macos' || github.event.inputs.build_target == 'macos-arm64'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build-environment

      - name: Parse tag version
        id: version
        uses: ./.github/actions/parse-tag-version
        with:
          tag: ${{ github.event_name == 'workflow_dispatch' && format('cereal-client/{0}', github.event.inputs.version) || github.ref_name }}

      - name: Install Apple certificate
        id: apple-cert
        uses: ./.github/actions/install-apple-certificate
        with:
          certificate-base64: ${{ env.APPLE_CERTIFICATE_BASE64 }}
          certificate-password: ${{ env.APPLE_CERTIFICATE_PASSWORD }}

      - uses: ./.github/actions/setup-sekret
        with:
          sekret-properties: ${{ env.SEKRET_PROPERTIES }}

      - name: Build and upload
        uses: ./.github/actions/build-and-upload
        with:
          version: ${{ steps.version.outputs.version }}
          version-number: ${{ steps.version.outputs.version-number }}
          is-rc: ${{ steps.version.outputs.is-rc }}
          target: Dmg
          mac-arch: arm64
          sentry-auth-token: ${{ env.SENTRY_AUTH_TOKEN }}
          sentry-dsn: ${{ env.SENTRY_DSN }}
          sekret-key: ${{ env.SEKRET_KEY }}
          mac-signing-enabled: 'true'
          mac-signing-identity: ${{ env.APPLE_SIGNING_IDENTITY }}
          mac-signing-keychain: ${{ steps.apple-cert.outputs.keychain-path }}
          mac-notarization-apple-id: ${{ env.APPLE_ID }}
          mac-notarization-password: ${{ env.APPLE_ID_PASSWORD }}
          mac-notarization-team-id: ${{ env.APPLE_TEAM_ID }}
          mac-entitlements-path: 'cereal-client/entitlements.plist'
          version-json-platform: macos-arm64
          cdn-url: ${{ env.CDN_URL }}
          # Auto-update feed points at the self-appliable .app zip, not the .dmg (the .dmg stays on
          # the CDN for the website's first-time download). See build-and-upload's feed-binary step.
          download-url: ${{ env.CDN_URL }}/client/cereal-client-latest-arm64.zip
          min-version: ${{ env.MIN_VERSION_MACOS_ARM64 }}
          release-private-key: ${{ env.RELEASE_PRIVATE_KEY }}
          cloudflare-zone-id: ${{ env.CLOUDFLARE_ZONE_ID }}
          cloudflare-api-token: ${{ env.CLOUDFLARE_CACHE_PURGE_TOKEN }}
          r2-account-id: ${{ env.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ env.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ env.R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ env.R2_BUCKET_CDN }}
          do-access-key: ${{ env.DO_ACCESS_KEY }}
          do-secret-key: ${{ env.DO_SECRET_KEY }}
          do-space-name: ${{ env.DO_SPACE_NAME_BACKUPS }}
          do-space-region: ${{ env.DO_SPACE_REGION }}

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-logs-macos-arm64
          path: cereal-client/build/compose/logs/
          retention-days: 7

      # Also create a generic 'macos' version JSON for backward compatibility (points to ARM64)
      - name: Create generic macOS version JSON
        if: steps.version.outputs.is-rc == 'false'
        uses: ./.github/actions/create-latest-version-json
        with:
          version: ${{ steps.version.outputs.version }}
          platform: macos
          cdn-url: ${{ env.CDN_URL }}
          download-url: ${{ env.CDN_URL }}/client/cereal-client-latest-arm64.zip
          min-version: ${{ env.MIN_VERSION_MACOS }}
          # Reuse the ARM64 self-update .zip that the build-and-upload step already placed in
          # dist/client (must match its download-url so the signed hash covers the served file).
          binary-path: dist/client/cereal-client-latest-arm64.zip
          release-private-key: ${{ env.RELEASE_PRIVATE_KEY }}

      - name: Upload generic macOS version JSON to R2
        if: steps.version.outputs.is-rc == 'false'
        uses: ./.github/actions/upload-to-r2
        with:
          account-id: ${{ env.R2_ACCOUNT_ID }}
          access-key-id: ${{ env.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ env.R2_SECRET_ACCESS_KEY }}
          bucket: ${{ env.R2_BUCKET_CDN }}
          source-dir: dist

      # Purge the generic macos JSON too. The arm64 zip it points at is already purged by the
      # publish-artifact tail in the Build and upload step above.
      - name: Purge Cloudflare cache for generic macOS version JSON
        if: steps.version.outputs.is-rc == 'false'
        uses: ./.github/actions/purge-cloudflare-cache
        with:
          zone-id: ${{ env.CLOUDFLARE_ZONE_ID }}
          api-token: ${{ env.CLOUDFLARE_CACHE_PURGE_TOKEN }}
          files: |
            ${{ env.CDN_URL }}/client/latest-macos.json

      - name: Clean up keychain
        if: always()
        run: security delete-keychain ${{ steps.apple-cert.outputs.keychain-path }} || true

  build-macos-x64:
    name: Build macOS Intel x64 (DMG)
    environment: release
    runs-on: macos-15-intel
    if: github.event_name == 'push' || github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'macos' || github.event.inputs.build_target == 'macos-x64'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build-environment

      - name: Parse tag version
        id: version
        uses: ./.github/actions/parse-tag-version
        with:
          tag: ${{ github.event_name == 'workflow_dispatch' && format('cereal-client/{0}', github.event.inputs.version) || github.ref_name }}

      - name: Install Apple certificate
        id: apple-cert
        uses: ./.github/actions/install-apple-certificate
        with:
          certificate-base64: ${{ env.APPLE_CERTIFICATE_BASE64 }}
          certificate-password: ${{ env.APPLE_CERTIFICATE_PASSWORD }}

      - uses: ./.github/actions/setup-sekret
        with:
          sekret-properties: ${{ env.SEKRET_PROPERTIES }}

      - name: Build and upload
        uses: ./.github/actions/build-and-upload
        with:
          version: ${{ steps.version.outputs.version }}
          version-number: ${{ steps.version.outputs.version-number }}
          is-rc: ${{ steps.version.outputs.is-rc }}
          target: Dmg
          mac-arch: x64
          sentry-auth-token: ${{ env.SENTRY_AUTH_TOKEN }}
          sentry-dsn: ${{ env.SENTRY_DSN }}
          sekret-key: ${{ env.SEKRET_KEY }}
          mac-signing-enabled: 'true'
          mac-signing-identity: ${{ env.APPLE_SIGNING_IDENTITY }}
          mac-signing-keychain: ${{ steps.apple-cert.outputs.keychain-path }}
          mac-notarization-apple-id: ${{ env.APPLE_ID }}
          mac-notarization-password: ${{ env.APPLE_ID_PASSWORD }}
          mac-notarization-team-id: ${{ env.APPLE_TEAM_ID }}
          mac-entitlements-path: 'cereal-client/entitlements.plist'
          version-json-platform: macos-x64
          cdn-url: ${{ env.CDN_URL }}
          # Auto-update feed points at the self-appliable .app zip, not the .dmg (see arm64 job).
          download-url: ${{ env.CDN_URL }}/client/cereal-client-latest-x64.zip
          min-version: ${{ env.MIN_VERSION_MACOS_X64 }}
          release-private-key: ${{ env.RELEASE_PRIVATE_KEY }}
          cloudflare-zone-id: ${{ env.CLOUDFLARE_ZONE_ID }}
          cloudflare-api-token: ${{ env.CLOUDFLARE_CACHE_PURGE_TOKEN }}
          r2-account-id: ${{ env.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ env.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ env.R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ env.R2_BUCKET_CDN }}
          do-access-key: ${{ env.DO_ACCESS_KEY }}
          do-secret-key: ${{ env.DO_SECRET_KEY }}
          do-space-name: ${{ env.DO_SPACE_NAME_BACKUPS }}
          do-space-region: ${{ env.DO_SPACE_REGION }}

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-logs-macos-x64
          path: cereal-client/build/compose/logs/
          retention-days: 7

      - name: Clean up keychain
        if: always()
        run: security delete-keychain ${{ steps.apple-cert.outputs.keychain-path }} || true

  build-windows-store:
    name: Build Windows Store (MSIX)
    environment: release
    runs-on: windows-latest
    if: |
      (github.event_name == 'push' && !contains(github.ref_name, '-rc')) ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'windows-store'))

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build-environment

      - name: Parse tag version
        id: version
        uses: ./.github/actions/parse-tag-version
        with:
          tag: ${{ github.event_name == 'workflow_dispatch' && format('cereal-client/{0}', github.event.inputs.version) || github.ref_name }}

      - uses: ./.github/actions/setup-sekret
        with:
          sekret-properties: ${{ env.SEKRET_PROPERTIES }}

      - name: Build MSI
        uses: ./.github/actions/build-client
        with:
          target: Msi
          version: ${{ steps.version.outputs.version-number }}
          store-build: 'true'
          sentry-auth-token: ${{ env.SENTRY_AUTH_TOKEN }}
          sentry-dsn: ${{ env.SENTRY_DSN }}
          sekret-key: ${{ env.SEKRET_KEY }}

      - name: Create MSIX from MSI
        id: msix
        uses: ./.github/actions/create-msix
        with:
          version: ${{ steps.version.outputs.version-number }}

      # NOTE: The latest version JSON for Windows Store is NOT uploaded here.
      # Use the "Publish Windows Store Version" workflow manually after the MSIX
      # has been published to the Microsoft Store.

      - name: Backup MSIX to DO Spaces
        uses: ./.github/actions/upload-to-do-spaces
        with:
          access-key: ${{ env.DO_ACCESS_KEY }}
          secret-key: ${{ env.DO_SECRET_KEY }}
          space-name: ${{ env.DO_SPACE_NAME_BACKUPS }}
          space-region: ${{ env.DO_SPACE_REGION }}
          source: ${{ steps.msix.outputs.msix-path }}
          out-dir: 'client/${{ steps.version.outputs.version }}/'

      - name: Backup proguard mapping to DO Spaces
        uses: ./.github/actions/upload-to-do-spaces
        with:
          access-key: ${{ env.DO_ACCESS_KEY }}
          secret-key: ${{ env.DO_SECRET_KEY }}
          space-name: ${{ env.DO_SPACE_NAME_BACKUPS }}
          space-region: ${{ env.DO_SPACE_REGION }}
          source: cereal-client/proguard.map
          out-dir: 'client/${{ steps.version.outputs.version }}/msix/'

  # Headless mode as a Docker image, one job per arch on a native runner: jpackage can't cross-build,
  # so there is no QEMU. Each job builds the same app-image as build-linux, builds the image from it,
  # runs the smoke gate inside it and only then pushes it by digest; publish-docker tags the manifest.
  build-docker:
    name: Build Docker image (${{ matrix.arch }})
    environment: release
    runs-on: ${{ matrix.runner }}
    if: github.event_name == 'push' || github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'docker'
    permissions:
      contents: read
      packages: write
    env:
      # ENABLE WITH #43: set to 'true' once the prompt page exists (see "Smoke test prompt page index").
      PROMPT_PAGE_SMOKE: 'false'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build-environment

      - name: Parse tag version
        id: version
        uses: ./.github/actions/parse-tag-version
        with:
          tag: ${{ github.event_name == 'workflow_dispatch' && format('cereal-client/{0}', github.event.inputs.version) || github.ref_name }}

      - uses: ./.github/actions/setup-sekret
        with:
          sekret-properties: ${{ env.SEKRET_PROPERTIES }}

      # Same flags as build-appimage, so the image carries the same release app-image as the AppImage.
      - name: Build app-image (distributable)
        shell: bash
        run: |
          ./gradlew cereal-client:createReleaseDistributable \
            -Pversion='${{ steps.version.outputs.version-number }}' \
            -Pdebug=false \
            -Pflavor=prod \
            -Pstore_build=false \
            -Psentry_auth_token=${{ env.SENTRY_AUTH_TOKEN }} \
            -Psentry_dsn=${{ env.SENTRY_DSN }} \
            -Penvironment=production \
            -Psekret_key=${{ env.SEKRET_KEY }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The build context is only the app-image directory (see cereal-client/docker/Dockerfile), and
      # no build args are passed, so neither sekret.properties nor any token reaches a layer.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: cereal-client/build/compose/binaries/main-release/app
          file: cereal-client/docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          provenance: false
          load: true
          tags: cereal:smoke

      # Every release, not only RCs: this is the only run of the headless path and of Chrome's sandbox
      # before the image reaches users.
      - name: Smoke test inside the image
        shell: bash
        timeout-minutes: 5
        env:
          # The documented run options; seccomp.json is what lets Chrome build its sandbox.
          RUN_OPTS: --shm-size=1g --security-opt seccomp=cereal-client/docker/seccomp.json
        run: |
          set -euo pipefail

          echo "::group::Runs as uid 1000"
          test "$(docker run --rm --entrypoint id cereal:smoke -u)" = 1000
          echo "::endgroup::"

          # No --no-sandbox: Chrome aborts ("Failed to move to new namespace") if it can't sandbox.
          echo "::group::Chrome --headless=new with its sandbox"
          # shellcheck disable=SC2086
          docker run --rm $RUN_OPTS --entrypoint google-chrome-stable cereal:smoke \
            --headless=new --dump-dom 'data:text/html,<p>cereal-smoke</p>' | grep cereal-smoke
          echo "::endgroup::"

          # The real entrypoint (tini + launcher --headless) with CEREAL_SMOKE_TEST=1: the desktop
          # probes plus the headless probe, which needs the TTY that -t gives it.
          # shellcheck disable=SC2086
          docker run --rm -t $RUN_OPTS -e CEREAL_SMOKE_TEST=1 cereal:smoke

      # Boots the image for real and fetches the prompt page index with and without the password.
      - name: Smoke test prompt page index (#43)
        if: env.PROMPT_PAGE_SMOKE == 'true'
        shell: bash
        timeout-minutes: 3
        env:
          RUN_OPTS: --shm-size=1g --security-opt seccomp=cereal-client/docker/seccomp.json
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          docker run -d -t --name cereal-prompt-smoke $RUN_OPTS -p 127.0.0.1:6080:6080 \
            -e CEREAL_PROMPT_PASSWORD=cereal-smoke cereal:smoke
          trap 'docker logs cereal-prompt-smoke || true; docker rm -f cereal-prompt-smoke' EXIT
          for _ in $(seq 60); do
            curl -fsS -o /dev/null -u cereal:cereal-smoke http://127.0.0.1:6080/ && break
            sleep 2
          done
          curl -fsS -o /dev/null -u cereal:cereal-smoke http://127.0.0.1:6080/
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:6080/)" = 401

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same inputs as "Build image", so this is a cache hit that only pushes. By digest only: tags go
      # on the multi-arch manifest in publish-docker.
      - name: Push image by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: cereal-client/build/compose/binaries/main-release/app
          file: cereal-client/docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          provenance: false
          outputs: type=image,name=${{ env.DOCKER_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        shell: bash
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Needs no environment secret, only GITHUB_TOKEN (like `release`).
  publish-docker:
    name: Publish Docker manifest
    needs: build-docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse tag version
        id: version
        uses: ./.github/actions/parse-tag-version
        with:
          tag: ${{ github.event_name == 'workflow_dispatch' && format('cereal-client/{0}', github.event.inputs.version) || github.ref_name }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: docker-digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The version tag on every release; `latest` only moves on a non-RC release.
      - name: Create multi-arch manifest
        id: manifest
        shell: bash
        working-directory: ${{ runner.temp }}/digests
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IS_RC: ${{ steps.version.outputs.is-rc }}
        run: |
          set -euo pipefail
          tags=(-t "$DOCKER_IMAGE:$VERSION")
          if [ "$IS_RC" = 'false' ]; then
            tags+=(-t "$DOCKER_IMAGE:latest")
          fi
          sources=()
          for digest in *; do
            sources+=("$DOCKER_IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          DIGEST=$(docker buildx imagetools inspect "$DOCKER_IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # Verifiable with `gh attestation verify oci://ghcr.io/cereal-automation/cereal:<version> --owner Cereal-Automation`.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.DOCKER_IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    # Needed to create the tag (manual dispatch) and publish the release.
    permissions:
      contents: write
    # Always create a release: on a tag push and on every manual dispatch, whatever the
    # build target. The target is surfaced in the release name so partial manual builds
    # are distinguishable.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse tag version
        id: version
        uses: ./.github/actions/parse-tag-version
        with:
          tag: ${{ github.event_name == 'workflow_dispatch' && format('cereal-client/{0}', github.event.inputs.version) || github.ref_name }}

      - name: Create Github Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # On a tag push the tag already exists; on manual dispatch the action creates
          # this tag on the checked-out commit before publishing the release.
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('cereal-client/{0}', github.event.inputs.version) || github.ref_name }}
          # Manual single-platform runs append the build target, e.g. "1.2.0 (windows)";
          # tag pushes and full ('all') manual builds stay "1.2.0".
          name: ${{ steps.version.outputs.version }}${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_target != 'all' && format(' ({0})', github.event.inputs.build_target) || '' }}
          prerelease: ${{ steps.version.outputs.is-rc == 'true' }}
          make_latest: ${{ steps.version.outputs.is-rc == 'false' }}
          generate_release_notes: true
