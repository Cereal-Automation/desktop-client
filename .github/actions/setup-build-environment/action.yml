name: 'Setup Build Environment'
description: 'Setup Gradle cache and configure JDK(s)'

runs:
  using: 'composite'
  steps:
    - name: Make gradlew executable
      shell: bash
      run: chmod +x ./gradlew

    - name: Set up JDKs
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: 'zulu'
        java-version: |
          17
          21

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        # Release jobs run on tag pushes (a non-default branch ref), where
        # setup-gradle defaults to read-only caching. Force writes so each
        # release run warms the cache for the next.
        cache-read-only: false

