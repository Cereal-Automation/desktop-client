[versions]
# Kotlin and Compose
kotlin = "2.3.21"
compose = "1.10.1"
compose-material3 = "1.9.0"
ksp = "2.3.9"
jakarta-mail = "2.1.5"
angus-mail = "2.0.5"

# Core Libraries
coroutines = "1.11.0"
coroutines-result = "4.0.0"
room = "2.8.4"
sqlite = "2.7.0"
koin = "4.2.2"
koin-compose = "4.2.2"

# Networking
okhttp = "5.4.0"

# UI and Desktop
compose-material-icons = "1.7.3"

# Logging
logback = "1.5.38"

# Third-party Libraries
cache4k = "0.14.0"
sentry-kotlin = "0.27.0"
semver = "2.1.0"
kotlinx-serialization = "1.11.0"
kotlinx-collections-immutable = "0.5.1"
kotlin-csv = "1.10.0"
kamel = "1.0.9"
ktor = "3.5.1"
kdriver = "0.5.11"
# markdown-renderer 0.42+ is built against Kotlin 2.4 and pulls kotlin-stdlib 2.4.0 into the
# runtime classpath, which ProGuard 7.8.2/7.9.1 cannot process. Bump together with Kotlin 2.4.
markdown-renderer = "0.41.0"
# Sekret 2.4.0 requires the Kotlin 2.4 compiler; keep in lockstep with the `kotlin` version.
sekret = "2.3.0"
sekret-lib = "2.3.0"
cereal-sdk = "1.12.0"
cereal-test-utils = "1.11.0"

# Java native interface
jna = "5.19.1"

# Testing
junit4 = "4.13.2"
junit5 = "6.1.1"
mockk = "1.14.11"
coroutines-test = "1.11.0"

# Build Tools
ktlint = "14.2.0"
detekt = "1.23.8"

sentry-gradle = "6.14.0"
buildconfig = "6.0.10"

versions = "0.54.0"
kover = "0.9.8"

[libraries]
# Kotlin
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

# Coroutines
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
coroutines-result = { module = "com.github.kittinunf.result:result-coroutines", version.ref = "coroutines-result" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines-test" }

# Room
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }

# Koin
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin-compose" }

# OkHttp
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
okhttp-tls = { module = "com.squareup.okhttp3:okhttp-tls", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }

# kotlinx.serialization
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinx-collections-immutable" }

# Compose
compose-material-icons = { module = "org.jetbrains.compose.material:material-icons-core", version.ref = "compose-material-icons" }
compose-material-icons-extended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "compose-material-icons" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose" }
compose-ui-test-junit4 = { module = "org.jetbrains.compose.ui:ui-test-junit4", version.ref = "compose" }

# Logging
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

# Third-party
cache4k = { module = "io.github.reactivecircus.cache4k:cache4k", version.ref = "cache4k" }
sentry-kotlin = { module = "io.sentry:sentry-kotlin-multiplatform", version.ref = "sentry-kotlin" }
semver = { module = "net.swiftzer.semver:semver", version.ref = "semver" }
kotlin-csv = { module = "com.github.doyaaaaaken:kotlin-csv-jvm", version.ref = "kotlin-csv" }
kamel ={ module = "media.kamel:kamel-image-default", version.ref = "kamel" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
kdriver = { module = "dev.kdriver:core", version.ref = "kdriver" }
markdown-renderer = { module = "com.mikepenz:multiplatform-markdown-renderer-m3", version.ref = "markdown-renderer" }
sekret = { module = "dev.datlag.sekret:sekret", version.ref = "sekret-lib" }
cereal-sdk = { module = "com.cereal-automation:cereal-sdk", version.ref = "cereal-sdk" }
cereal-test-utils = { module = "com.cereal-automation:cereal-test-utils", version.ref = "cereal-test-utils" }

# Java native interface
java-native-interface = { module = "net.java.dev.jna:jna", version.ref = "jna" }

# Jakarta Mail
jakarta-mail = { module = "jakarta.mail:jakarta.mail-api", version.ref = "jakarta-mail" }
angus-mail = { module = "org.eclipse.angus:angus-mail", version.ref = "angus-mail" }

# Testing
junit4 = { module = "junit:junit", version.ref = "junit4" }
junit5 = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit5" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

# Build classpath dependencies


[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }

sentry = { id = "io.sentry.jvm.gradle", version.ref = "sentry-gradle" }
buildconfig = { id = "com.github.gmazzo.buildconfig", version.ref = "buildconfig" }
sekret = { id = "dev.datlag.sekret", version.ref = "sekret" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
versions = { id = "com.github.ben-manes.versions", version.ref = "versions" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }

[bundles]
okhttp = ["okhttp", "okhttp-logging"]
kotlinx-serialization = ["kotlinx-serialization-core", "kotlinx-serialization-json"]
testing = ["junit4", "junit5", "mockk", "kotlin-test"]
coroutines = ["coroutines-core", "coroutines-swing"]
